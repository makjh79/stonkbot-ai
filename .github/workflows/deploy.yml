name: Deploy to Live Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Note: The live index.html is immutable on the server (chattr +i).
    # Only this workflow can modify it. No additional guard is needed.

    - name: Setup SSH and Deploy
      env:
        SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        # Setup SSH directory
        mkdir -p ~/.ssh

        # Debug: Check if secret is set (don't print it!)
        if [ -z "$SSH_KEY_B64" ]; then
          echo "ERROR: SERVER_SSH_KEY secret is not set!"
          exit 1
        fi
        echo "Secret is set, length: ${#SSH_KEY_B64}"

        # Decode base64 key
        if ! echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key 2>~/.ssh/b64.err; then
          echo "::error::Base64 decode failed: $(cat ~/.ssh/b64.err)"
          exit 1
        fi
        chmod 600 ~/.ssh/deploy_key

        # Debug: Check key format
        echo "Key file size: $(wc -c < ~/.ssh/deploy_key)"
        head -1 ~/.ssh/deploy_key

        # Add host to known hosts
        ssh-keyscan -H 23.80.82.47 >> ~/.ssh/known_hosts 2>/dev/null || true

        # Test SSH connection with verbose logging for diagnosis
        if ! ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o LogLevel=VERBOSE root@23.80.82.47 "echo 'SSH connected'" > ~/.ssh/ssh_test.log 2>&1; then
          echo "::error::SSH test connection failed"
          cat ~/.ssh/ssh_test.log
          exit 1
        fi
        echo "SSH test connection succeeded"

        # Deploy + clean up stale nginx backups
        # NOTE: Deploy from the main repo (/opt/stonk-ai), not the nested website-repo.
        # Sentiment/history data are generated in-place by the server pipeline.
        if ! ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@23.80.82.47 \
          "cd /opt/stonk-ai && \
           echo '--- pre-pull git status ---' && \
           git status --short && \
           git pull --autostash origin master && \
           \
           echo '--- restore stonkai ownership after root git pull ---' && \
           chown -R stonkai:stonkai /opt/stonk-ai && \
           \
           echo '--- pre-deploy feature checks ---' && \
           grep -q 'TAB PANEL: Overview' website/index.html || { echo 'FAIL: Overview tab missing'; exit 1; } && \
           grep -q 'TAB PANEL: Holdings' website/index.html || { echo 'FAIL: Holdings tab missing'; exit 1; } && \
           grep -q 'TAB PANEL: Watchlist' website/index.html || { echo 'FAIL: Watchlist tab missing'; exit 1; } && \
           grep -q 'Bot vs. Market' website/index.html || { echo 'FAIL: Bot vs Market header missing'; exit 1; } && \
           grep -q 'Bot Thinking Log' website/index.html || { echo 'FAIL: Bot Thinking Log link missing'; exit 1; } && \
           grep -q 'Updated: ' website/index.html || { echo 'FAIL: Freshness timestamp missing'; exit 1; } && \
           echo 'PASS: pre-deploy checks' && \
           \
           chattr -i /var/www/hedge-fund-website/index.html && \
           cp /opt/stonk-ai/website/index.html /var/www/hedge-fund-website/index.html && \
           chown stonkai:stonkai /var/www/hedge-fund-website/index.html && \
           chmod 0644 /var/www/hedge-fund-website/index.html && \
           chattr +i /var/www/hedge-fund-website/index.html && \
           \
           cp /opt/stonk-ai/website/performance.html /var/www/hedge-fund-website/performance.html && \
           chown stonkai:stonkai /var/www/hedge-fund-website/performance.html && \
           chmod 0644 /var/www/hedge-fund-website/performance.html && \
           \
           chattr -i /var/www/hedge-fund-website/thinking.html && \
           cp /opt/stonk-ai/website/thinking.html /var/www/hedge-fund-website/thinking.html && \
           chown stonkai:stonkai /var/www/hedge-fund-website/thinking.html && \
           chmod 0644 /var/www/hedge-fund-website/thinking.html && \
           chattr +i /var/www/hedge-fund-website/thinking.html && \
           cp /opt/stonk-ai/dm_paper/sleeve_state.json /var/www/hedge-fund-website/dm_paper/sleeve_state.json && \
           cp /opt/stonk-ai/dm_paper/sleeve_equity.csv /var/www/hedge-fund-website/dm_paper/sleeve_equity.csv && \
           cp /opt/stonk-ai/dm_paper/sleeve_rebalance_signal.json /var/www/hedge-fund-website/dm_paper/sleeve_rebalance_signal.json && \
           cp /opt/stonk-ai/dm_paper/rebalance_executions.json /var/www/hedge-fund-website/dm_paper/rebalance_executions.json && \
           cp /opt/stonk-ai/dm_paper/sleeve_watchlist.json /var/www/hedge-fund-website/dm_paper/sleeve_watchlist.json && \
           cp /opt/stonk-ai/dm_paper/dm_state.json /var/www/hedge-fund-website/dm_paper/dm_state.json && \
           cp /opt/stonk-ai/dm_paper/dm_equity.csv /var/www/hedge-fund-website/dm_paper/dm_equity.csv && \
           chown -R stonkai:stonkai /var/www/hedge-fund-website/dm_paper && \
           chmod -R 0644 /var/www/hedge-fund-website/dm_paper && \
           rm -f /etc/nginx/sites-enabled/*.bak.* && \
           \
           echo '--- post-deploy verification ---' && \
           if diff -q /opt/stonk-ai/website/index.html /var/www/hedge-fund-website/index.html > /dev/null; then \
             echo 'PASS: web root matches source'; \
           else \
             echo 'FAIL: web root does not match source'; \
             exit 1; \
           fi && \
           \
           echo 'Deployed at '\$(date) >> /var/www/hedge-fund-website/deploy.log"; then
          echo "::error::Remote deploy command failed"
          exit 1
        fi
